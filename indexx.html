<!DOCTYPE html>
<html>
<head>
    <title>Grade Calculator</title>
    <style>
        body { font-family: sans-serif; padding: 40px; }
        .box { border: 1px solid #ccc; padding: 20px; width: 350px; background: #fafafa; border-radius: 5px; }
        #result { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="box">
        <h2>Calculate Grade</h2>
        
        <label>Enter Amount: </label>
        <input type="number" id="myScore">
        <button onclick="checkMyGrade()">Submit</button>

        <div id="result"></div>
    </div>

    <script>
        function checkMyGrade() {
            var score = document.getElementById("myScore").value;
            var output = document.getElementById("result");

            var letter = "";
            if (score >= 80) {
                letter = "A";
            } else if (score >= 70) {
                letter = "B";
            } else if (score >= 60) {
                letter = "C";
            } else if (score >= 50) {
                letter = "D";
            } else {
                letter = "F";
            }

            output.innerHTML = "You got an " + letter;
        }
    </script>

</body>
</html>
