<!DOCTYPE html><html><head><title>Change Calculator</title><style>body{font-family:sans-serif;padding:20px;max-width:400px}input,button{padding:8px;font-size:16px;margin-bottom:10px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ccc;padding:8px;text-align:left}</style></head><body><h2>Change Calculator</h2><input type="number" id="amt" placeholder="Enter amount"><button onclick="calc()">Calculate</button><div id="output"></div><script>function calc(){let amount=parseInt(document.getElementById("amt").value);if(isNaN(amount)||amount<0)return;const denoms=[["$1000 note",1000],["$500 note",500],["$100 note",100],["$50 note",50],["$20 note",20],["$10 coin",10],["$5 coin",5],["$2 coin",2],["$1 coin",1]];let table="<table><tr><th>Denomination</th><th>Count</th></tr>";for(let [name,val] of denoms){let count=Math.floor(amount/val);amount%=val;table+="<tr><td>"+name+"</td><td>"+count+"</td></tr>"}table+="</table>";document.getElementById("output").innerHTML=table}</script></body></html>
