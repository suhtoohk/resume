<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How Far From University?</title>
<style>

        body {

            font-family: Arial, sans-serif;

            padding: 30px;

            max-width: 400px;

            margin: auto;

        }

        .form-group {

            margin-bottom: 15px;

        }

        label {

            display: block;

            margin-bottom: 5px;

            font-weight: bold;

        }

        input {

            width: 100%;

            padding: 8px;

            box-sizing: border-box;

        }

        button {

            padding: 10px 15px;

            margin-top: 10px;

            cursor: pointer;

        }

        #result {

            margin-top: 20px;

            font-size: 18px;

            font-weight: bold;

        }
</style>
</head>
<body>
<h2>How far from University?</h2>
<div class="form-group">
<label for="x">Value X:</label>
<input type="number" id="x" placeholder="Enter x">
</div>
<div class="form-group">
<label for="y">Value Y:</label>
<input type="number" id="y" placeholder="Enter y">
</div>
<button onclick="calculateDistance()">Calculate Distance</button>
<button onclick="history.back()">Back</button> <!-- Back button as mentioned in assignment -->
<div id="result"></div>
<script>

        function calculateDistance() {

            // Get inputs

            const x = parseFloat(document.getElementById('x').value);

            const y = parseFloat(document.getElementById('y').value);

            // Input Validation

            if (isNaN(x) || isNaN(y)) {

                document.getElementById('result').style.color = "red";

                document.getElementById('result').innerText = "Please enter valid numbers for both X and Y.";

                return;

            }

            // Formula: Distance = sqrt(x^2 + y^2)

            const distance = Math.sqrt(Math.pow(x, 2) + Math.pow(y, 2));

            // Display Result

            document.getElementById('result').style.color = "black";

            document.getElementById('result').innerText = "Distance: " + distance.toFixed(2);

        }
</script>
</body>
</html>
