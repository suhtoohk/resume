!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Measurement Converter</title>
</head>
<body>

    <h2>Measurement Converter</h2>

    <label for="inchInput">Enter Inch: </label>
    <input type="number" id="inchInput" placeholder="Type a number...">

    <button onclick="convertMeasurement()">Submit</button>

    <p id="resultText"></p>

    <script>
        function convertMeasurement() {
            // Grab the number from the input field
            let inchValue = document.getElementById("inchInput").value;
            
            // Check if the user actually typed a number
            if (inchValue === "") {
                document.getElementById("resultText").innerHTML = "Please enter a valid number.";
                return;
            }
            
            // Convert inches to centimeters (1 inch = 2.54 cm)
            let cmValue = inchValue * 2.54;
            
            // Display the final output on the screen
            document.getElementById("resultText").innerHTML = "Equal to " + cmValue + " cm";
        }
    </script>

</body>
</html>
